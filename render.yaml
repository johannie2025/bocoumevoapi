services:
  - type: web
    name: evolution-api-instance
    env: docker
    plan: free # Force l'utilisation du Free Tier (512 Mo RAM)
    region: frankfurt # Choisissez la région la plus proche de votre client (oregon, frankfurt, etc.)
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERVER_URL
        sync: false # À remplacer par votre URL .onrender.com après le premier déploiement
      - key: DATABASE_TYPE
        value: sqlite # OBLIGATOIRE : Postgres consommerait trop de RAM pour le free tier
      - key: DATABASE_CONNECTION_CLIENT
        value: sqlite3
      - key: DATABASE_CONNECTION_DATABASE
        value: /evolution/config/database.sqlite
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        value: VotreCleSecreteSuperPuissante123! # Changez cette clé !
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=400 # Crucial : Empêche Node.js de dépasser 400 Mo de RAM (laissant 112 Mo pour l'OS)
