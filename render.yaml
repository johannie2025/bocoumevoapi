services:
  - type: web
    name: bocoumevoapi
    env: docker
    plan: free
    region: frankfurt
    # ICI : On charge directement l'image officielle sans compiler
    image: atendai/evolution-api:latest
    envVars:
      - key: SERVER_URL
        value: https://bocoumevoapi.onrender.com
      - key: DATABASE_TYPE
        value: sqlite
      - key: DATABASE_CONNECTION_CLIENT
        value: sqlite3
      - key: DATABASE_CONNECTION_DATABASE
        value: /evolution/config/database.sqlite
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        value: VotreCleSecreteSuperPuissante123! # Changez cette clé pour votre client
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=400 # Indispensable pour éviter que Render ne coupe l'application
